<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — VulSentinel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body d-flex align-items-center justify-content-center py-5">
  <div class="auth-card card shadow-sm p-4" style="width:480px">
    <div class="text-center mb-4">
      <i class="bi bi-shield-fill-exclamation text-danger" style="font-size:2.5rem"></i>
      <h4 class="fw-bold mt-2 mb-0">VulSentinel Setup</h4>
      <p class="text-muted small">Create your administrator account</p>
    </div>

    {% if errors %}
    <div class="alert alert-danger py-2 small">
      <ul class="mb-0 ps-3">
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
      </ul>
    </div>
    {% endif %}

    <form method="post" action="/setup">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Password <span class="text-muted">(min 8 chars)</span></label>
        <input type="password" name="password" class="form-control" minlength="8" required>
      </div>

      {% if config_assets %}
      <div class="mb-3 p-3 bg-light rounded">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="import_assets" id="importAssets" value="true" checked>
          <label class="form-check-label fw-semibold small" for="importAssets">
            Import {{ config_assets | length }} asset(s) from config.yaml
          </label>
        </div>
        <div class="mt-2 small text-muted">
          {% for a in config_assets %}
          <span class="badge bg-secondary me-1">{{ a }}</span>
          {% endfor %}
        </div>
      </div>
      {% endif %}

      <button type="submit" class="btn btn-danger w-100 fw-semibold mt-2">
        <i class="bi bi-check-circle-fill"></i> Create Account &amp; Start
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

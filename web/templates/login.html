<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CVE Triage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body d-flex align-items-center justify-content-center">
  <div class="auth-card card shadow-sm p-4" style="width:360px">
    <div class="text-center mb-4">
      <i class="bi bi-shield-fill-exclamation text-danger" style="font-size:2.5rem"></i>
      <h4 class="fw-bold mt-2 mb-0">CVE Triage</h4>
      <p class="text-muted small">Internal Security Dashboard</p>
    </div>

    {% if setup_done %}
    <div class="alert alert-success py-2 small">
      <i class="bi bi-check-circle-fill"></i> Setup complete. Log in with your new account.
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-danger w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
